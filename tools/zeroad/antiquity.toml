# Which 0 A.D. art dresses which OpenCity model in the antiquity skins.
# Baked by scripts/bake-0ad.sh straight from the original 0 A.D. repository
# (only the actors, meshes and textures listed here are downloaded).
#
# Keys are OpenCity graphic codes (see assets/graphism.conf). Values pick:
#   structure = "<name>"  a structure of `civ` (house, storehouse, farmstead,
#                         barracks, stable, fortress, wall_tower, field, civil_centre)
#   actor = "<path>"      any actor from the manifest
#   gaia = "<kind>"       an entry of the [gaia] lists below, with `index`
#   look = N              which variant (default: the code, modulo the variants)
# Each model is scaled to the OpenCity footprint of the code it replaces.

[source]
repo = "https://gitea.wildfiregames.com/0ad/0ad.git"
commit = "cedd5e89a0ebdaec42ea938a51ef7c89d6ad7645"

# Largest texture side, in pixels.
max_texture = 1024

# Gaia (nature) actors, by kind.
[gaia]
wood = ["flora/trees/european_beech", "flora/trees/oak_new", "flora/trees/pine", "flora/trees/poplar", "flora/trees/fir_tree"]
stone = ["geology/stonemine_temperate_quarry", "geology/stonemine_temperate_small", "geology/stone_granite_med"]
metal = ["geology/metalmine_temperate_slabs", "geology/metal_temperate_round", "geology/metal_temperate_small"]
food = ["props/flora/farming_barley_harvest_a", "props/flora/farming_barley_harvest_b"]
decor = ["flora/trees/european_beech", "flora/trees/oak_new", "flora/trees/poplar_lombardy"]

[bake]
# One skin is baked per culture: assets/skins/antiquity-<civ>/.
# `colour` is painted where 0 A.D. textures mark the player colour.
# The first culture is the one chosen automatically for ancient dates.
cultures = [
  { civ = "rome",  colour = [160, 45, 35] },
  { civ = "athen", colour = [40, 90, 170] },
  { civ = "gaul",  colour = [60, 120, 50] },
  { civ = "ptol",  colour = [200, 160, 40] },
  { civ = "han",   colour = [170, 30, 40] },
  { civ = "maur",  colour = [210, 110, 30] },
]

[models]
# Residential: empty plot, then houses of growing size.
10 = { actor = "structures/plot" }
11 = { structure = "house", look = 0 }
12 = { structure = "house", look = 1 }
13 = { structure = "house", look = 2 }
14 = { structure = "house", look = 3 }
15 = { structure = "house", look = 1 }
16 = { structure = "house", look = 2 }
17 = { structure = "house", look = 3 }
18 = { structure = "farmstead" }
19 = { structure = "barracks" }
# Commercial: market buildings.
20 = { actor = "structures/plot" }
21 = { structure = "storehouse" }
22 = { structure = "storehouse" }
23 = { structure = "storehouse" }
24 = { structure = "farmstead" }
25 = { structure = "civil_centre" }
26 = { structure = "storehouse" }
27 = { structure = "stable" }
28 = { structure = "stable" }
29 = { structure = "civil_centre" }
# Industrial: fields, workshops, quarries and mines.
30 = { actor = "structures/plot" }
31 = { gaia = "food", index = 0 }
32 = { gaia = "food", index = 1 }
33 = { gaia = "stone", index = 1 }
34 = { gaia = "metal", index = 2 }
35 = { structure = "farmstead" }
36 = { gaia = "stone", index = 0 }
37 = { gaia = "metal", index = 0 }
38 = { structure = "stable" }
39 = { structure = "barracks" }
# "Power": the foundry is a fortress; services.
300 = { structure = "fortress" }
350 = { structure = "wall_tower" }
360 = { structure = "barracks" }
370 = { structure = "civil_centre" }
390 = { structure = "civil_centre" }
# Nature.
320 = { gaia = "decor", index = 2 }
330 = { gaia = "wood", index = 0 }
331 = { gaia = "wood", index = 1 }
332 = { gaia = "wood", index = 2 }
333 = { gaia = "wood", index = 3 }
334 = { gaia = "wood", index = 4 }
