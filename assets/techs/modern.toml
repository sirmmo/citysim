# Tech tree for the modern GlassBox rules (rules/glassbox.toml).
#
# A tech tree is kept apart from the rules: rule sets name one with
# `tech_tree = "<id>"`, can share one, or go without (then nothing is locked).
# Each project spends pooled resources (research points) and may:
#   unlock   units (by id) or tools; whatever any project names stays locked
#            until one of the projects naming it is done;
#   bonus    add a share of production ({ goods = 0.2 } is 20% more goods);
#   exclude  rival projects: finishing one rules the others out for good.
# `category` and `tier` only arrange the research window; `requires` and the
# cost are the gates, so a deep project opens as soon as its requirements do.
# A school makes about 2 research points a tick, some 2,400 a year; a high
# school 7 and a university 24.

name = "Modern"
description = "Roads, towers, industry and power for a modern city, and the economy it bets on."

# ---------------------------------------------------------------- transport
[[tech]]
id = "motorways"
name = "Motorways"
description = "Grade-separated roads for fast traffic between districts."
category = "Transport"
tier = 1
cost = { research = 2000 }
unlocks = ["highway"]

[[tech]]
id = "railways"
name = "Railways"
description = "Track, signals and stations: trains link towns far apart."
category = "Transport"
tier = 1
cost = { research = 1500 }
unlocks = ["rail", "station"]

[[tech]]
id = "public_transport"
name = "Public transport"
description = "Bus routes on the streets, and trams on tracks laid in them."
category = "Transport"
tier = 1
cost = { research = 1200 }
unlocks = ["bus_stop", "tram", "tram_stop"]

[[tech]]
id = "metro"
name = "Metro"
description = "Tunnels bored under the city, with trains every few minutes."
category = "Transport"
tier = 2
requires = ["public_transport"]
cost = { research = 3000 }
unlocks = ["metro", "metro_station"]

[[tech]]
id = "ports"
name = "Ports"
description = "Quays, cranes and customs: cargo ships trade with the rest of the world."
category = "Transport"
tier = 1
cost = { research = 1500 }
unlocks = ["seaport"]

[[tech]]
id = "aviation"
name = "Aviation"
description = "A runway and a terminal: tourists fly in, freight flies out."
category = "Transport"
tier = 2
requires = ["public_transport"]
cost = { research = 4000 }
unlocks = ["airport"]

# ---------------------------------------------------------------- economy
# The city's economic doctrine: one or the other, for good.
[[tech]]
id = "service_economy"
name = "Service economy"
description = "Offices, shops and cafés: more taxes and far more ideas. Rules out industrial policy."
category = "Economy"
tier = 2
cost = { research = 1500 }
bonus = { taxes = 0.1, ideas = 0.3 }
excludes = ["industrial_policy"]

[[tech]]
id = "industrial_policy"
name = "Industrial policy"
description = "Subsidised plants and rail sidings: more goods and fuel. Rules out the service economy."
category = "Economy"
tier = 2
cost = { research = 1500 }
bonus = { goods = 0.2, fuel = 0.1 }
excludes = ["service_economy"]

[[tech]]
id = "computing"
name = "Computing"
description = "Mainframes in the schools: research comes faster."
category = "Economy"
tier = 2
cost = { research = 3000 }
bonus = { research = 0.25 }

# ---------------------------------------------------------------- education
[[tech]]
id = "secondary_education"
name = "Secondary education"
description = "Schooling past the age of twelve: high schools make research three times as fast as a school."
category = "Education"
tier = 1
cost = { research = 1000 }
unlocks = ["high_school"]

[[tech]]
id = "higher_education"
name = "Higher education"
description = "Faculties and laboratories: a university makes research twelve times as fast as a school."
category = "Education"
tier = 2
requires = ["secondary_education"]
cost = { research = 3500 }
unlocks = ["university"]

# ---------------------------------------------------------------- housing
[[tech]]
id = "steel_frame"
name = "Steel-frame towers"
description = "Lifts and steel skeletons let buildings rise past ten floors."
category = "Housing"
tier = 2
cost = { research = 4000 }
unlocks = ["tower_2", "tower_3", "mall_3"]

# ---------------------------------------------------------------- industry
[[tech]]
id = "aeronautics"
name = "Aeronautics"
description = "Aircraft engineering for the heaviest industry."
category = "Industry"
tier = 3
cost = { research = 5000 }
requires = ["motorways"]
unlocks = ["plant_3"]

# ---------------------------------------------------------------- power
[[tech]]
id = "fission"
name = "Nuclear fission"
description = "Power from splitting atoms: vast output, no smoke."
category = "Power"
tier = 3
cost = { research = 8000 }
requires = ["steel_frame"]
unlocks = ["nuclear_plant"]
