# GlassBox-style rules for OpenCity: everything the city simulates is data.
#
# Resources flow between buildings ("units"): zones need and produce them,
# networks move them, services use them and cover the map with layers.
# Copy this file to make your own rules; see docs/RULES.md.

id = "glassbox"
name = "GlassBox"
description = "Modern resource-driven simulation: workers, shoppers, goods and cars travel by road, power through the grid; services cover the map."
# Ages these rules suit; older ages default to the pre-industrial rules.
years = [1800, 9999]
population = "residents"
# GlassBox rule scripts compiled into this set (docs/GLASSBOX.md).
scripts = ["glassbox.gbx"]
# Research projects, kept in their own file: <data>/techs/modern.toml.
tech_tree = "modern"
# Taxes and policies, in their own file: <data>/policies/modern.toml.
policy_set = "modern"

[growth]
level_up = 0.75      # satisfaction needed to grow a level
level_down = 0.3     # below this a building shrinks, then the plot empties
chance = 0.15        # per tick, for an eligible building
max_new = 4          # new buildings per tick and zone type
road_access = 3      # a road must be this close for a plot to develop
grace = 40           # ticks a building stays as built (or as levelled) before changing again
patience = 15        # ticks in a row past a threshold before levelling up/down or abandoning
saturation = 0.1     # a zone stops spreading while this share of its settled buildings fail
neglect = 120        # ticks a building bears a need (or an outlet) met by less than half before it shrinks a level

# Running the city: paid every tick for each resident, more per head as the
# city grows (clerks, courts, street lamps). Unpaid, every zone building
# loses `unpaid` satisfaction.
[administration]
name = "Administration"
cost = 0.008
doubles_at = 20000
unpaid = 0.15

# The day. Resources with a `tide` make their trips around its hours (the
# game's clock turns once a month); over a day the traffic adds up to the
# same. Units that work round the clock (`round_the_clock = true`, and a
# share of a zone's buildings) change shifts at these hours instead.
[shifts]
hours = [6, 14, 22]
spread = 1.0

# ---------------------------------------------------------------- resources
[[resource]]
id = "workers"
name = "Workers"
transport = "agents"
network = "road"
max_trip = 30
tide = { out = [8], back = [18], spread = 1.5, shifts = true }   # the commute; staff of round-the-clock units follow [shifts]
colour = [0.35, 0.65, 1.0]       # links on the network view
price = 0.02                     # per unit traded with neighbouring cities

[[resource]]
id = "shoppers"
name = "Shoppers"
transport = "agents"
network = "road"
max_trip = 20
tide = { out = [11, 17.5], back = [13, 19.5], spread = 2 }   # late morning and after work
colour = [1.0, 0.45, 0.75]       # links on the network view
price = 0.02                     # per unit traded with neighbouring cities

[[resource]]
id = "goods"
name = "Goods"
transport = "agents"
network = "road"
max_trip = 40
tide = { out = [10, 15], spread = 3 }   # deliveries by day, one way
colour = [1.0, 0.7, 0.2]       # links on the network view
price = 0.05                     # per unit traded with neighbouring cities

# Cars: one resource with two kinds. Both fill the same parking slots at
# shops and workplaces (a need for "car"), but each draws on another network:
# petrol cars need fuel and dirty the air along their routes, electric cars
# charge from the power grid at home.
[[resource]]
id = "car"
name = "Cars"
transport = "agents"
network = "road"
max_trip = 30
tide = { out = [8, 12], back = [14, 18], spread = 2, shifts = true }
colour = [0.75, 0.75, 0.8]
weight = 0.5                     # parking matters less than staff or customers

  [[resource.subtype]]
  id = "gasoline"
  name = "Petrol cars"
  share = 0.75
  colour = [0.9, 0.35, 0.25]
  uses = { fuel = 0.25 }                  # per car sent, the next tick
  trail = { "AirQuality.pm10" = 0.1 }     # per car and tile travelled

  [[resource.subtype]]
  id = "electric"
  name = "Electric cars"
  share = 0.25
  colour = [0.3, 0.9, 0.6]
  uses = { power = 0.3 }

[[resource]]
id = "fuel"
name = "Fuel"
transport = "agents"
network = "road"
max_trip = 40
tide = { out = [10, 15], spread = 3 }
colour = [0.65, 0.45, 0.95]
price = 0.04                     # per unit traded with neighbouring cities

[[resource]]
id = "power"
name = "Power"
transport = "grid"
network = "power_grid"
colour = [1.0, 0.95, 0.35]       # links on the network view
price = 0.01                     # per unit traded with neighbouring cities
weight = 4                       # in satisfaction: a unit of power counts for four of workers

[[resource]]
id = "water"
name = "Water"
transport = "grid"
network = "water"
colour = [0.30, 0.60, 1.0]
price = 0.01                     # per unit traded with neighbouring cities
weight = 2

[[resource]]
id = "sewage"
name = "Sewage treatment"
transport = "grid"
network = "water"
colour = [0.55, 0.45, 0.30]

[[resource]]
id = "waste"
name = "Rubbish collection"
transport = "agents"
network = "road"
max_trip = 40
tide = { out = [6], spread = 2 }   # the early round
colour = [0.65, 0.55, 0.35]

[[resource]]
id = "taxes"
name = "Taxes"
transport = "city"

[[resource]]
id = "upkeep"
name = "Upkeep"
transport = "city"
weight = 25                      # an unfunded service all but stops

[[resource]]
id = "residents"
name = "Residents"
transport = "local"

# Pooled resources gather city-wide and never travel: people meeting in
# cafés and taverns have ideas, schools turn them into research points, and
# research projects ([[tech]] at the end) spend those.
[[resource]]
id = "ideas"
name = "Ideas"
transport = "pool"
# Culture: ideas spread between the towns of a region.
shared = true

[[resource]]
id = "research"
name = "Research points"
transport = "pool"

# ---------------------------------------------------------------- networks
[[network]]
id = "road"
name = "Roads"
structures = ["road"]

# Vehicles on the roads. Trips of the resources each one carries are drawn
# as that vehicle, which keeps to its ways (road kinds; none listed = all).
[[network.vehicle]]
id = "car"
name = "Car"
model = "car"
carries = ["workers", "shoppers", "car"]
share = 4
# Kenney car kit (CC0), one picked per trip; without the files, `model`.
meshes = ["kenney/car-kit/sedan", "kenney/car-kit/suv", "kenney/car-kit/hatchback-sports", "kenney/car-kit/van", "kenney/car-kit/suv-luxury"]

[[network.vehicle]]
id = "taxi"
name = "Taxi"
model = "car"
carries = ["shoppers"]
share = 0.5
meshes = ["kenney/car-kit/taxi"]

[[network.vehicle]]
id = "sports_car"
name = "Sports car"
model = "sports_car"
carries = ["shoppers"]
meshes = ["kenney/car-kit/sedan-sports", "kenney/car-kit/race"]

[[network.vehicle]]
id = "truck"
name = "Delivery truck"
model = "pickup"
carries = ["goods", "fuel"]
direct = true                    # quickest route, even through traffic
meshes = ["kenney/car-kit/delivery", "kenney/car-kit/truck", "kenney/car-kit/truck-flat", "kenney/car-kit/delivery-flat"]

# Rubbish trucks go out from dumps, recycling centres and incinerators to
# the buildings they collect from.
[[network.vehicle]]
id = "garbage_truck"
name = "Rubbish truck"
model = "pickup"
carries = ["waste"]
meshes = ["kenney/car-kit/garbage-truck"]

# Buses and trams run on lines between their stops (`line`), not door to
# door: people near two stops of one line ride (docs/RULES.md#buses-and-trams).
# Buses use the streets; trams their tram streets.
[[network.vehicle]]
id = "bus"
name = "Bus"
model = "bus"
line = "bus"
ways = ["street", "tram", "paved_street", "highway"]
carries = ["workers", "shoppers"]
share = 0

[[network.vehicle]]
id = "tram"
name = "Tram"
model = "car"
line = "tram"
ways = ["tram"]
carries = ["workers", "shoppers"]
share = 0
meshes = ["kenney/train-kit/train-tram-modern", "kenney/train-kit/train-tram-classic", "kenney/train-kit/train-tram-round"]

# Metro trains run in the tunnels between metro stations, out of sight.
[[network.vehicle]]
id = "metro"
name = "Metro"
model = "car"
line = "metro"
carries = ["workers", "shoppers"]
share = 0

# Trains run on track between stations; places near stations on one line
# trade as if next door (see docs/RULES.md#railways).
[[network.vehicle]]
id = "train"
name = "Train"
model = "car"
ways = ["rail"]
carries = ["workers", "shoppers", "goods"]
share = 0
meshes = ["kenney/train-kit/train-diesel-a", "kenney/train-kit/train-diesel-b", "kenney/train-kit/train-electric-city-a", "kenney/train-kit/train-electric-double-a"]

# Ships sail between harbours on one body of water (docs/RULES.md#waterways).
[[network.vehicle]]
id = "ship"
name = "Ship"
model = "car"
ways = ["water"]
carries = ["workers", "shoppers", "goods", "fuel"]
share = 0
meshes = ["kenney/watercraft/ship-cargo-a", "kenney/watercraft/ship-cargo-b", "kenney/watercraft/boat-tug-a", "kenney/watercraft/ship-small"]

[[network]]
id = "power_grid"
name = "Power grid"
# Power runs along power lines and roads, and through connected buildings.
structures = ["power_line", "road"]
through_buildings = true

[[network]]
id = "water"
name = "Water mains"
# Mains are pipes laid underground (under streets, buildings or open land),
# and run on through connected buildings; sewage goes back the same way to
# the treatment plants.
structures = ["water_pipe"]
through_buildings = true


# ---------------------------------------------------------------- disasters
# Now and then a disaster strikes a neighbourhood (about every `every` ticks;
# some 1,200 ticks make a year). Each building in reach is hit with a risk
# that falls with the `protection` layer there, down to 5% at `full`.
[[disaster]]
id = "fire"
name = "Fire"
description = "A fire spreads through the blocks around it."
every = 6000
radius = 2
effect = "destroy"
protection = "fire_safety"

[[disaster]]
id = "flood"
name = "Flood"
description = "The water rises over the low ground along the shore."
every = 9000
radius = 4
effect = "damage"
near_water = true

[[disaster]]
id = "epidemic"
name = "Epidemic"
description = "A fever spreads; the sick stay home."
every = 8000
radius = 5
effect = "sicken"
protection = "health"

# ---------------------------------------------------------------- map layers
[[layer]]
id = "pollution"
name = "Pollution"
diffusion = 0.15
decay = 0.08
colour = [0.55, 0.4, 0.15]
max = 60.0

[[layer]]
id = "land_value"
name = "Land value"
diffusion = 0.1
decay = 0.06
colour = [0.2, 0.75, 0.3]
max = 60.0

[[layer]]
id = "fire_safety"
name = "Fire coverage"
decay = 1.0
colour = [0.95, 0.3, 0.2]
max = 10.0

[[layer]]
id = "police_safety"
name = "Police coverage"
decay = 1.0
colour = [0.3, 0.4, 0.95]
max = 10.0

[[layer]]
id = "health"
name = "Health coverage"
decay = 1.0
colour = [0.95, 0.95, 0.95]
max = 10.0

[[layer]]
id = "education"
name = "Education coverage"
decay = 1.0
colour = [0.95, 0.8, 0.2]
max = 10.0

# Maps written by the GlassBox script's agent rules.
[[layer]]
id = "AirQuality.pm10"
name = "Air quality (PM10)"
diffusion = 0.2
decay = 0.1
colour = [0.6, 0.6, 0.65]
max = 40.0

[[layer]]
id = "Noise.level"
name = "Noise"
diffusion = 0.1
decay = 0.3
colour = [0.9, 0.5, 0.9]
max = 30.0

# ---------------------------------------------------------------- zones
[[zone]]
id = "residential"
name = "Residential"
structure = "residential"
base_demand = 3.0
# Houses appear when jobs are left open, and stop coming while people
# already here look for work.
demand = [
  { resource = "workers", from = "unmet", weight = 0.5 },
  { resource = "workers", from = "undelivered", weight = -0.25 },
]
densities = [
  { id = "low", name = "Low density", cost = 5, units = ["house_1", "house_2", "house_3"] },
  { id = "medium", name = "Medium density", cost = 10, units = ["townhouse_1", "townhouse_2", "townhouse_3"] },
  { id = "high", name = "High density", cost = 20, units = ["tower_1", "tower_2", "tower_3"] },
]

[[zone]]
id = "commercial"
name = "Commercial"
structure = "commercial"
round_the_clock = 0.05          # one building in twenty works day and night, in shifts
# Shops appear when shoppers and goods find nowhere to go.
demand = [
  { resource = "shoppers", from = "undelivered", weight = 0.5 },
  { resource = "goods", from = "undelivered", weight = 0.3 },
]
densities = [
  { id = "low", name = "Low density", cost = 5, units = ["shop_1", "shop_2", "shop_3"] },
  { id = "medium", name = "Medium density", cost = 10, units = ["store_1", "store_2", "store_3"] },
  { id = "high", name = "High density", cost = 20, units = ["mall_1", "mall_2", "mall_3"] },
]

[[zone]]
id = "industrial"
name = "Industrial"
structure = "industrial"
round_the_clock = 0.05          # one building in twenty works day and night, in shifts
base_demand = 1.0
# Industry appears with unemployed workers and shops short of goods.
demand = [
  { resource = "workers", from = "undelivered", weight = 0.5 },
  { resource = "goods", from = "unmet", weight = 0.5 },
]
densities = [
  { id = "low", name = "Low density", cost = 8, units = ["workshop_1", "workshop_2", "workshop_3"] },
  { id = "medium", name = "Medium density", cost = 15, units = ["factory_1", "factory_2", "factory_3"] },
  { id = "high", name = "High density", cost = 25, units = ["plant_1", "plant_2", "plant_3"] },
]

# ---------------------------------------------------------------- services
[services]
coal_plant = "coal_plant"
nuclear_plant = "nuclear_plant"
fire_station = "fire_station"
police = "police_station"
hospital = "hospital"
school = "school"
high_school = "high_school"
university = "university"
park = "park"
station = "station"
harbour = "harbour"
bus_stop = "bus_stop"
tram_stop = "tram_stop"
metro_station = "metro_station"
airport = "airport"
seaport = "seaport"
pumping_station = "pumping_station"
water_tower = "water_tower"
water_treatment = "water_treatment"
dump = "dump"
recycling = "recycling"
incinerator = "incinerator"

# ---------------------------------------------------------------- units
# Residential: residents produce workers and shoppers; they need power and
# clean air, and the bigger homes want services and land value. Workers and
# shoppers are `outlets`: homes whose people find no job within reach are
# as unhappy as homes without power, and half as much without shops.
[[unit]]
id = "house_1"
name = "Little house"
description = "A single-storey home on its own plot."
graphic = 11
produce = { residents = 4, workers = 2, shoppers = 2, taxes = 0.04, car = 1 }
needs = { power = 1 }
sends = ["workers", "shoppers", "car"]
outlets = { workers = 1, shoppers = 0.5 }
requires = { pollution = { max = 30 } }

[[unit]]
