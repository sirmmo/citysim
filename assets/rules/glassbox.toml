# Ports: gates to the rest of the world. `trade` is how much of each
# resource may come in (when the city lacks it) or go out (when it has
# nowhere to go) per tick, at the resource's price.
[[unit]]
id = "seaport"
name = "Seaport"
description = "Cargo ships from the rest of the world: brings in the goods and fuel the city lacks, ships out what it cannot sell."
graphic = 398
needs = { workers = 12, power = 3, upkeep = 1.5 }
trade = { goods = 30, fuel = 20 }

