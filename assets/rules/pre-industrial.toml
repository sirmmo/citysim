# Pre-industrial GlassBox rules: towns before steam and electricity
# (antiquity, the Middle Ages, the Renaissance).
#
# No power, no cars. People walk, so trips are short; food comes from the
# fields, goods from quarries, mines and workshops; carts carry trade, and
# horse carts eat fodder. Wells give water, and the bigger houses need it.
# Same model as glassbox.toml (see docs/RULES.md); units reuse the models
# of the modern rules, which the period skins dress as their own buildings.

id = "pre-industrial"
name = "Pre-industrial GlassBox"
description = "Towns before steam and electricity: people walk, carts carry trade, fields feed the town, wells give water."
population = "residents"
scripts = ["pre-industrial.gbx"]
years = [-9999, 1799]
# No electricity, and no asphalt: streets are dirt or paved.
disabled_tools = ["power_line", "nuclear_plant", "road", "highway"]

[growth]
level_up = 0.75
level_down = 0.3
chance = 0.12
max_new = 3
road_access = 3
grace = 40
patience = 15
saturation = 0.1

# ---------------------------------------------------------------- resources
[[resource]]
id = "workers"
name = "Workers"
transport = "agents"
network = "road"
max_trip = 30                     # tiles of street; dirt roads halve it
colour = [0.35, 0.65, 1.0]

[[resource]]
id = "shoppers"
name = "Customers"
transport = "agents"
network = "road"
max_trip = 22
colour = [1.0, 0.45, 0.75]

[[resource]]
id = "food"
name = "Food"
transport = "agents"
network = "road"
max_trip = 40
colour = [0.55, 0.85, 0.3]

[[resource]]
id = "goods"
name = "Goods"
transport = "agents"
network = "road"
max_trip = 40
colour = [1.0, 0.7, 0.2]

# Carts: trade needs them at markets and workshops. Handcarts need nothing;
# horse carts eat fodder from the farms, and dirty the streets.
[[resource]]
id = "cart"
name = "Carts"
transport = "agents"
network = "road"
max_trip = 36
colour = [0.75, 0.6, 0.45]

  [[resource.subtype]]
  id = "handcart"
  name = "Handcarts"
  share = 0.6
  max_trip = 20
  colour = [0.85, 0.75, 0.55]

  [[resource.subtype]]
  id = "horse"
  name = "Horse carts"
  share = 0.4
  colour = [0.6, 0.4, 0.25]
  uses = { fodder = 0.3 }
  trail = { pollution = 0.02 }

[[resource]]
id = "fodder"
name = "Fodder"
transport = "agents"
network = "road"
max_trip = 36
colour = [0.85, 0.85, 0.35]

[[resource]]
id = "taxes"
name = "Taxes"
transport = "city"

[[resource]]
id = "upkeep"
name = "Upkeep"
transport = "city"

[[resource]]
id = "residents"
name = "Residents"
transport = "local"

# ---------------------------------------------------------------- networks
[[network]]
id = "road"
name = "Streets"
structures = ["road"]

# ---------------------------------------------------------------- map layers
[[layer]]
id = "pollution"
name = "Smoke & dirt"
diffusion = 0.15
decay = 0.1
colour = [0.55, 0.4, 0.15]
max = 40.0

[[layer]]
id = "land_value"
name = "Land value"
diffusion = 0.1
decay = 0.06
colour = [0.2, 0.75, 0.3]
max = 40.0

[[layer]]
id = "water"
name = "Water"
decay = 1.0
colour = [0.3, 0.6, 1.0]
max = 10.0

[[layer]]
id = "fire_safety"
name = "Fire watch"
decay = 1.0
colour = [0.95, 0.3, 0.2]
max = 10.0

[[layer]]
id = "police_safety"
name = "Guard"
decay = 1.0
colour = [0.3, 0.4, 0.95]
max = 10.0

[[layer]]
id = "health"
name = "Health"
decay = 1.0
colour = [0.95, 0.95, 0.95]
max = 10.0

[[layer]]
id = "education"
name = "Learning"
decay = 1.0
colour = [0.95, 0.8, 0.2]
max = 10.0

[[layer]]
id = "Noise.level"
name = "Noise"
diffusion = 0.1
decay = 0.3
colour = [0.9, 0.5, 0.9]
max = 20.0

# ---------------------------------------------------------------- zones
[[zone]]
id = "residential"
name = "Residential"
structure = "residential"
base_demand = 3.0
demand = [{ resource = "workers", from = "unmet", weight = 0.5 }]
densities = [
  { id = "low", name = "Low density", cost = 2, units = ["hut", "cottage", "family_house"] },
  { id = "medium", name = "Medium density", cost = 5, units = ["town_house", "merchant_house", "row_houses"] },
  { id = "high", name = "High density", cost = 10, units = ["tenement", "courtyard_house", "insula"] },
]

[[zone]]
id = "commercial"
name = "Commercial"
structure = "commercial"
demand = [
  { resource = "shoppers", from = "undelivered", weight = 0.5 },
  { resource = "goods", from = "undelivered", weight = 0.3 },
  { resource = "food", from = "undelivered", weight = 0.05 },
]
densities = [
  { id = "low", name = "Low density", cost = 2, units = ["market_stall", "bakery", "shop"] },
  { id = "medium", name = "Medium density", cost = 5, units = ["covered_market", "tavern", "coaching_inn"] },
  { id = "high", name = "High density", cost = 10, units = ["caravanserai", "market_square", "exchange"] },
]

[[zone]]
id = "industrial"
name = "Fields & crafts"
structure = "industrial"
base_demand = 1.5
demand = [
  { resource = "workers", from = "undelivered", weight = 0.5 },
  { resource = "food", from = "unmet", weight = 0.5 },
  { resource = "goods", from = "unmet", weight = 0.4 },
]
densities = [
  { id = "low", name = "Fields", cost = 3, units = ["grain_field", "farm", "farmstead"] },
  { id = "medium", name = "Quarries & mines", cost = 6, units = ["quarry", "mine", "stone_works"] },
  { id = "high", name = "Workshops", cost = 12, units = ["foundry", "stables", "craft_hall"] },
]

# ---------------------------------------------------------------- services
[services]
coal_plant = "granary"
fire_station = "watchtower"
police = "guard_house"
hospital = "bathhouse"
school = "academy"
park = "well"

