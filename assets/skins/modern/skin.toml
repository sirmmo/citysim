name = "Modern (Kenney)"
description = "Today's towns built from the CC0 Kenney city kits: suburban houses, shops and towers, workshops and factories."
era = "Modern"
culture = "Kenney city kits"

[applies]
years = [1946, 9999]
# New cities with no date or world use it too. View > Skin > None brings
# back OpenCity's own buildings.
default = true

[look]
vehicles = true
# Bridges stand on Kenney City Kit Roads pillars.
bridge_pier = "kenney/city-roads/bridge-pillar"
skybox = "graphism/texture/sky_day.png"
smoke = true

# Graphic code -> model. `models/...` is shared art under the data folder:
# Kenney City Kit Suburban, Commercial and Industrial (CC0). Each model is
# scaled to fit the footprint of the OpenCity building it replaces.
# Services, the nuclear plant and the park keep OpenCity's models.
[models]
# Residential: house_1..3, townhouse_1..3, tower_1..3 (GlassBox units).
# Houses are composed from parts (models/composed/*.compose): one of
# several houses, tints, trees and parked cars, picked per plot.
11 = "models/composed/house_small.compose"
12 = "models/composed/house_family.compose"
13 = "models/kenney/city-suburban/building-type-c.obj"
14 = "models/kenney/city-suburban/building-type-b.obj"
15 = "models/kenney/city-suburban/building-type-n.obj"
