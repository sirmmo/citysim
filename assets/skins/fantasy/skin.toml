name = "Fantasy realm"
description = "For OpenFantasyMap worlds: vivid colours, magic instead of electricity, no cars."
era = "Fantasy"
culture = "Generic realm"

disabled_tools = ["highway", "rail", "station"]

[applies]
# World names from the GeoJSON `world` member or --world; edit to taste.
worlds = ["Eldoria", "*fantasy*", "ofm:*"]

[look]
sky = [0.55, 0.45, 0.80]
tint = [0.95, 0.90, 1.10]
saturation = 1.35
water = [0.25, 0.20, 0.70, 0.60]
ui_accent = [140, 80, 200]
ui_panel = [30, 22, 42]
vehicles = false
# Bridges stand on Kenney Fantasy Town Kit stone pillars.
bridge_pier = "kenney/fantasy-town/pillar-stone"

[labels]
residential = "Cottages"
commercial = "Market & taverns"
industrial = "Smithies"
road = "Road"
power_line = "Ley line"
coal_plant = "Mage tower"
nuclear_plant = "Dragon forge"
fire_station = "Water elementalists"
police = "Guard house"
hospital = "Temple of healing"
school = "Academy of magic"
park = "Sacred grove"
trees = "Enchanted forest"
solar_plant = "Sun circle"
fusion_plant = "Arcane foundry"
wind_turbine = "Windmill"
high_school = "Hall of apprentices"
university = "Arcane university"
stadium = "Jousting lists"
mall = "Grand bazaar"
museum = "Hall of relics"
modern_art_museum = "Enchanters' gallery"
opera_house = "Bards' playhouse"
archaeology_museum = "Ancient ruins"
resort_hotel = "Elven retreat"
observation_tower = "Stargazer's tower"
amusement_park = "Faire"
mayors_office = "Lord's manor"
city_hall = "Council hall"
neighbourhood_office = "Ward house"
pumping_station = "Spring house"
water_tower = "Cistern tower"
water_treatment = "Purifying pools"
waterworks = "Water garden"
sewage_outfall = "Culvert"
wetland = "Reed bed"
dump = "Midden"
recycling = "Tinkers' yard"
incinerator = "Salamander kiln"
harbour = "Quay"
seaport = "Port"
bus_stop = "Waystone"
tram_stop = "Coach post"
metro_station = "Delvers' stair"
airport = "Griffin roost"

