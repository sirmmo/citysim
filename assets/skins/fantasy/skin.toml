name = "Fantasy realm"
description = "For OpenFantasyMap worlds: vivid colours, magic instead of electricity, no cars."
era = "Fantasy"
culture = "Generic realm"

disabled_tools = ["highway"]

[applies]
# World names from the GeoJSON `world` member or --world; edit to taste.
