name = "Town (Quaternius)"
description = "Painted brick town houses, terraces, shops and blocks from the CC0 Quaternius building pack; works, services and networks as in the modern skin."
era = "Modern"
culture = "Quaternius town houses"

[applies]
# Chosen from View > Skin only, for now (no years: the modern skin keeps
# being picked for today's cities).
default = false

[look]
vehicles = true
# Bridges stand on Kenney City Kit Roads pillars.
bridge_pier = "kenney/city-roads/bridge-pillar"
skybox = "graphism/texture/sky_day.png"
smoke = true

# Graphic code -> model. `models/...` is shared art under the data folder:
# homes and shops are Quaternius Ultimate Textured Building Pack town
# houses (CC0), painted per plot (models/composed/q_*.compose, written by
# scripts/gen-quaternius.py); the rest is the modern skin's Kenney art (CC0).
# Services, the nuclear plant and the park keep OpenCity's models.
[models]
# Residential and commercial: Quaternius town houses, shops and blocks.
11 = "models/composed/q_11.compose"
12 = "models/composed/q_12.compose"
13 = "models/composed/q_13.compose"
