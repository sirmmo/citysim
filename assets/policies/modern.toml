# Taxes and policies for the modern GlassBox rules (rules/glassbox.toml).
#
# Kept apart from the rules like tech trees: rule sets name one with
# `policy_set = "<id>"`, can share one, or go without.
#
# [[tax]]: scales a city resource made by the units of some zones. Units
# make what the rules write at the default `rate` (percent) and in
# proportion at other rates. Each point above the default adds `demand` to
# those zones and `satisfaction` to paying units (below: the opposite), and
# takes `steep` more satisfaction per squared point: a point or two is
# shrugged off, the top rates empty the town.
#
# [[policy]]: an axis of stances; the first is the default. A stance may
# need a research project (`requires`), and adds production `bonus`es,
# changes what units need (`needs`, a share per resource), adds zone `demand`,
# `satisfaction` for every unit and a running `cost` per tick (negative:
# income). `kinds` sets the shares of a resource's kinds (electric and
# petrol cars), `traffic` what every trip leaves on a map layer, `disasters`
# the odds of a disaster (a share per disaster id). A city makes some 25-30 in taxes a tick at 1,000 people.

name = "Modern"
description = "Property, sales and business taxes; transport, energy, education and growth policies."

# ---------------------------------------------------------------- taxes
[[tax]]
id = "property"
name = "Property tax"
description = "Paid by households on their homes."
resource = "taxes"
zones = ["residential"]
rate = 9
range = [0, 20]
demand = -0.4
satisfaction = -0.015
steep = 0.004

[[tax]]
id = "sales"
name = "Sales tax"
description = "Paid by shops on what they sell."
resource = "taxes"
zones = ["commercial"]
rate = 9
range = [0, 20]
demand = -0.4
satisfaction = -0.015
steep = 0.004

[[tax]]
id = "business"
name = "Business tax"
description = "Paid by workshops, factories and plants on their profits."
resource = "taxes"
zones = ["industrial"]
rate = 9
range = [0, 20]
demand = -0.5
satisfaction = -0.018
steep = 0.004

# ---------------------------------------------------------------- policies
[[policy]]
id = "transport"
name = "Transport"

[[policy.stance]]
id = "balanced"
name = "Balanced"
description = "Roads for cars, pavements for people."

[[policy.stance]]
id = "car_city"
name = "Car city"
description = "Free parking and wide roads: more car trips, more people moving in, a cost to the city."
bonus = { car = 0.2 }
demand = { residential = 1.5 }
cost = 0.5

[[policy.stance]]
id = "walkable_centres"
name = "Walkable centres"
description = "Pedestrian streets and squares: more people out shopping, fewer cars, and shops and workplaces that need half the parking."
bonus = { car = -0.2, shoppers = 0.1 }
needs = { car = -0.5 }
demand = { commercial = 1.0 }
satisfaction = 0.02
cost = 0.3

[[policy]]
id = "energy"
name = "Energy"

[[policy.stance]]
id = "balanced"
name = "Balanced"
description = "Whatever the plants make."

[[policy.stance]]
id = "efficiency"
name = "Efficiency drive"
description = "Grants for insulation and new turbines: more power from the same plants."
bonus = { power = 0.15 }
cost = 0.8

[[policy.stance]]
id = "atomic_age"
name = "Atomic age"
description = "The nuclear programme runs flat out: far more power, uneasy neighbours, and twice the risk of an accident at each plant."
requires = "fission"
bonus = { power = 0.3 }
disasters = { meltdown = 1.0 }
satisfaction = -0.02

[[policy]]
id = "education"
name = "Education"

[[policy.stance]]
id = "balanced"
name = "Balanced"
description = "Schools as they are."

[[policy.stance]]
id = "free_schooling"
name = "Free schooling"
description = "No fees and longer school years: more research, paid by the city."
bonus = { research = 0.3 }
satisfaction = 0.01
cost = 1.0

[[policy.stance]]
id = "night_classes"
name = "Night classes"
description = "Lectures after work: more ideas, tired workers."
requires = "computing"
bonus = { ideas = 0.25, workers = -0.05 }

[[policy]]
id = "growth"
name = "Growth"

[[policy.stance]]
id = "balanced"
name = "Balanced"
description = "The city grows as people come."

[[policy.stance]]
id = "open_city"
name = "Open city"
description = "Welcome newcomers: more people want to move in, some crowding."
demand = { residential = 3.0 }
satisfaction = -0.02

[[policy.stance]]
id = "strict_zoning"
name = "Strict zoning"
description = "Low limits and green belts: slower growth, nicer streets."
demand = { residential = -2.0, commercial = -1.0 }
satisfaction = 0.03

# What the cars run on. In the rules one car in four is electric: it leaves
# no fumes on its way and charges from the grid at home, where a petrol car
# burns fuel. `traffic` covers the rest of the road: commuters, vans and
# lorries (the agent rules of rules/glassbox.gbx) switch too, and electric
# motors are quieter. Tyres and brakes still leave some dust.
[[policy]]
id = "vehicles"
name = "Vehicles"

[[policy.stance]]
id = "balanced"
name = "As they come"
description = "People buy the car they like: one in four is electric."

[[policy.stance]]
id = "ev_grants"
name = "Electric car grants"
description = "Grants for electric cars and chargers along the streets: most cars run on the grid, vans and lorries follow."
requires = "electric_vehicles"
kinds = { "car.electric" = 0.6, "car.gasoline" = 0.4 }
traffic = { "AirQuality.pm10" = -0.3, "Noise.level" = -0.15 }
cost = 0.8

[[policy.stance]]
id = "combustion_ban"
name = "Combustion ban"
description = "No engine that burns fuel in town: clean, quiet streets, a heavier load on the grid, no more petrol sold, and some who miss their old car."
requires = "electric_vehicles"
kinds = { "car.electric" = 1.0, "car.gasoline" = 0.0 }
traffic = { "AirQuality.pm10" = -0.8, "Noise.level" = -0.4 }
satisfaction = -0.02
cost = 0.4

# How hard the town sells itself. Visitors arrive at airports, stations and
# harbours; a bonus on tourists brings more of them through each.
[[policy]]
id = "tourism"
name = "Tourism"

[[policy.stance]]
id = "balanced"
name = "Word of mouth"
description = "Visitors come as they hear of the town."

[[policy.stance]]
id = "advertising"
name = "Advertising campaign"
description = "Posters in every station of the country: a third more visitors, paid by the city."
requires = "tourism"
bonus = { tourists = 0.3 }
cost = 0.6

[[policy.stance]]
id = "festival"
name = "Festival season"
description = "Fireworks, concerts and a parade a month: half as many visitors again and busier shops, and crowds the residents tire of."
requires = "mass_entertainment"
bonus = { tourists = 0.5, shoppers = 0.1 }
satisfaction = -0.01
cost = 1.4
