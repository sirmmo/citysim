name: pages

# Publishes site/ to GitHub Pages (http://ingmmo.com/citysim/), with the
# browser version of the game built into site/play/ (see scripts/web.sh).
# It runs when the site changes, which every release does.
on:
  push:
    branches: [main]
    paths: ["site/**", "web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          key: wasm32
      - name: Browser build
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p opencity
          cargo run --locked -q -p xtask -- web-dist site/play
      - uses: actions/configure-pages@v5.0.0
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
