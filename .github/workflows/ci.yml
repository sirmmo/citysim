name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Format, lint and test in the pinned dev image
        run: |
          scripts/dev.sh cargo fmt --all --check
          scripts/dev.sh cargo clippy --workspace --all-targets -- -D warnings
          scripts/dev.sh cargo clippy --target wasm32-unknown-unknown -p opencity -- -D warnings
          scripts/dev.sh cargo test --workspace
          scripts/dev.sh cargo build -p opencity
      # Smoke test of the game under Xvfb. Informational: a headless GL/X
      # problem on the runner must not hide the real test results.
      - name: Screenshot
        continue-on-error: true
        timeout-minutes: 6
        run: |
          mkdir -p screenshots
          scripts/dev.sh timeout 240 xvfb-run -a -s "-screen 0 1280x800x24" /target/debug/opencity --demo --simulate-years 5 --no-audio --screenshot screenshots/ci.png
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: screenshot
          path: screenshots/ci.png
          if-no-files-found: ignore
