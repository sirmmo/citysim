<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>citysim</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-maskable-512.png">
<meta name="theme-color" content="#10141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="citysim">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="citysim, a free 3D city simulation, playing in the browser.">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #10141c; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; outline: none; }
  #status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; color: #cfd6e4; font: 16px/1.5 system-ui, sans-serif; text-align: center;
    padding: 24px; pointer-events: none; }
  #status b { display: block; font-size: 32px; color: #fff; margin-bottom: 10px; }
  #status.hidden { display: none; }
  #status a { color: #8fb4ff; pointer-events: auto; }
  #update { position: absolute; right: 12px; bottom: 12px; z-index: 2; display: none; padding: 10px 14px;
    border: 1px solid #3b4a66; border-radius: 6px; background: #1b2333; color: #e6ebf5;
    font: 14px/1.4 system-ui, sans-serif; cursor: pointer; text-align: left; }
  #update.shown { display: block; }
  #update small { display: block; color: #9fb0cc; }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<div id="status"><b>citysim</b><span id="status-text">Loading the game…</span></div>
<button id="update" type="button">A new version of citysim is ready.<small>Save your city, then click here to restart with it.</small></button>
<script src="mq_js_bundle.js"></script>
<script src="citysim.js"></script>
<script>
  window.addEventListener("error", function (e) {
    citysim_status("Could not start: " + e.message + ". The game needs WebGL and WebAssembly; " +
      "the desktop version is at https://github.com/sirmmo/citysim/releases.");
  });
  // Mouse buttons the game still believes are held. The browser does not
  // always tell the canvas a button was let go: the right-click menu takes
  // the release, and so does letting go outside the window or over another
  // element. The map then stayed tied to the mouse.
  (function () {
    var canvas = document.getElementById("glcanvas");
    var held = {};
    var bit = { 0: 1, 1: 4, 2: 2 }; // event.button -> its bit in event.buttons
    function release(button, e) {
      if (!held[button]) return;
      held[button] = false;
      if (typeof wasm_exports === "undefined" || !wasm_exports) return;
      var at = mouse_relative_position(e && e.clientX || 0, e && e.clientY || 0);
      wasm_exports.mouse_up(at.x, at.y, into_sapp_mousebutton(button));
    }
    function release_all(e) {
      for (var b in held) release(Number(b), e);
    }
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    canvas.addEventListener("mousedown", function (e) { held[e.button] = true; });
    canvas.addEventListener("mouseup", function (e) { held[e.button] = false; });
    // Let go anywhere else on the page or outside it.
    window.addEventListener("mouseup", function (e) { if (e.target !== canvas) release(e.button, e); }, true);
    window.addEventListener("blur", function () { release_all(null); });
    document.addEventListener("visibilitychange", function () { if (document.hidden) release_all(null); });
    // Whatever was missed: a move that reports the button up lets it go.
    window.addEventListener("mousemove", function (e) {
      for (var b in held) if (held[b] && !(e.buttons & bit[b])) release(Number(b), e);
    }, true);
  })();
  // The installed app. A service worker keeps the game for playing offline;
  // it needs a secure page (https, or localhost), so over plain http the
  // game plays as before and cannot be installed.
  if ("serviceWorker" in navigator && window.isSecureContext) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (registration) {
        var offer = function (worker) {
          // Only a build that replaces a running one is news.
          if (!worker || !navigator.serviceWorker.controller) return;
          var button = document.getElementById("update");
          button.onclick = function () {
            button.classList.remove("shown");
            navigator.serviceWorker.addEventListener("controllerchange", function () { window.location.reload(); });
            worker.postMessage("update");
          };
          button.classList.add("shown");
        };
        if (registration.waiting) offer(registration.waiting);
        registration.addEventListener("updatefound", function () {
          var worker = registration.installing;
          if (!worker) return;
          worker.addEventListener("statechange", function () {
            if (worker.state === "installed") offer(worker);
          });
        });
      }).catch(function (e) { console.warn("service worker:", e); });
      // Saves live in local storage: ask the browser not to clear it when
      // the disk runs short.
      if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
    });
  }
  if (!window.WebAssembly) {
    citysim_status("This browser has no WebAssembly. The desktop version is at https://github.com/sirmmo/citysim/releases.");
  } else {
    load("opencity.wasm");
  }
</script>
</body>
</html>
