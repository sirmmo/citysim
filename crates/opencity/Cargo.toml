[package]
name = "opencity"
description = "OpenCity: a 3D city simulation (Rust port)"
# Package fields are spelled out (not inherited from the workspace) because
# cargo-quad-apk embeds an older Cargo that cannot parse inheritance.
version = "0.2.36"
edition = "2021"
rust-version = "1.88"
license = "GPL-2.0-or-later"
authors = ["citysim contributors", "OpenCity authors (see AUTHORS and NOTICE.md)"]

[[bin]]
name = "opencity"
path = "src/main.rs"

[dependencies]
opencity-core.workspace = true
opencity-mapgen.workspace = true
opencity-assets.workspace = true
opencity-geo.workspace = true
anyhow.workspace = true
clap.workspace = true
env_logger.workspace = true
image.workspace = true
log.workspace = true
macroquad.workspace = true
# Desktop UI and the 0 A.D. bake (not built on Android, see xtask android-shim).
egui-macroquad.workspace = true
egui_plot.workspace = true
toml_edit.workspace = true
opencity-zeroad.workspace = true
ureq.workspace = true
serde_json.workspace = true

# Android packaging (cargo-quad-apk, see scripts/android.sh).
[package.metadata.android]
package_name = "io.github.sirmmo.citysim"
label = "CitySim"
version_code = 39
version_name = "0.2.36"
assets = "../../assets"
res = "android/res"
icon = "@mipmap/ic_launcher"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
fullscreen = true

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "userLandscape"
