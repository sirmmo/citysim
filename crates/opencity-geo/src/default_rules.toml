# OpenCity GeoJSON import rules.
#
# Each feature's properties are matched against the rules in order; the first
# matching rule decides what the feature becomes. A rule matches when every
# key in `when` is present and has one of the listed values ("*" = any value).
#
# build = residential | commercial | industrial | road | power_line
#       | coal_plant | nuclear_plant | park | trees | water
#       | fire_station | police | hospital | school | rail | station | harbour
#       | water_pipe | pumping_station | water_tower | water_treatment
#       | dump | recycling | incinerator | tram | bus_stop | tram_stop
#       | metro | metro_station | ignore
#
# Copy this file, edit it and pass it with `--rules` to map other tag
# vocabularies (for example a fantasy map with custom keys).

# Properties holding a terrain elevation in metres (points, contour lines).
elevation = ["ele", "elevation", "opencity:ele"]
# Lifespan properties for historical data (OpenHistoryMap / OpenHistoricalMap).
start_date = ["start_date", "opencity:start_date"]
end_date = ["end_date", "opencity:end_date"]
# Property giving building floors, used to pick an initial zone level.
levels = ["building:levels", "levels"]

# --- Round trip of OpenCity's own export -----------------------------------
[[rule]]
when = { "opencity:build" = "*" }
build = "from:opencity:build"

# --- Water --------------------------------------------------------------------
[[rule]]
when = { natural = ["water", "bay", "strait", "coastline_area"] }
build = "water"
[[rule]]
when = { waterway = ["riverbank", "river", "canal", "dock"] }
build = "water"
[[rule]]
when = { landuse = ["reservoir", "basin"] }
build = "water"

# --- Power --------------------------------------------------------------------
[[rule]]
when = { power = ["plant", "generator"], "plant:source" = "nuclear" }
build = "nuclear_plant"
[[rule]]
when = { power = ["plant", "generator"], "generator:source" = "nuclear" }
build = "nuclear_plant"
[[rule]]
when = { power = ["plant", "generator"], "plant:source" = "waste" }
build = "incinerator"
[[rule]]
when = { power = ["plant", "generator"] }
build = "coal_plant"
[[rule]]
when = { power = ["line", "minor_line", "cable"] }
build = "power_line"

# --- Public services -------------------------------------------------------
[[rule]]
when = { amenity = "fire_station" }
build = "fire_station"
[[rule]]
when = { amenity = "police" }
build = "police"
[[rule]]
when = { amenity = ["hospital", "clinic"] }
build = "hospital"
[[rule]]
when = { amenity = ["school", "university", "college", "kindergarten"] }
build = "school"
[[rule]]
when = { building = "fire_station" }
build = "fire_station"
[[rule]]
when = { building = "hospital" }
build = "hospital"
[[rule]]
when = { building = ["school", "university", "college"] }
build = "school"

# --- Roads ------------------------------------------------------------------
[[rule]]
when = { highway = [
    "motorway", "trunk", "primary", "secondary", "tertiary", "unclassified",
    "residential", "service", "living_street", "road", "pedestrian",
    "motorway_link", "trunk_link", "primary_link", "secondary_link", "tertiary_link",
] }
build = "road"

# --- Water and waste -------------------------------------------------------
[[rule]]
when = { man_made = "water_tower" }
build = "water_tower"
[[rule]]
when = { man_made = ["water_works", "pumping_station", "water_well"] }
build = "pumping_station"
[[rule]]
when = { man_made = "wastewater_plant" }
build = "water_treatment"
[[rule]]
when = { man_made = "pipeline", substance = "water" }
build = "water_pipe"
[[rule]]
when = { landuse = "landfill" }
build = "dump"
[[rule]]
when = { amenity = "recycling", recycling_type = "centre" }
build = "recycling"

# --- Harbours -----------------------------------------------------------------
[[rule]]
when = { landuse = "port" }
build = "harbour"
[[rule]]
when = { harbour = "yes" }
build = "harbour"

# --- Railways ----------------------------------------------------------------
[[rule]]
when = { railway = "subway_entrance" }
build = "metro_station"
[[rule]]
when = { railway = "station", station = "subway" }
build = "metro_station"
[[rule]]
when = { railway = "subway" }
build = "metro"
[[rule]]
when = { railway = ["tram_stop"] }
build = "tram_stop"
[[rule]]
when = { highway = "bus_stop" }
build = "bus_stop"
[[rule]]
when = { railway = "tram" }
build = "tram"
[[rule]]
when = { railway = ["station", "halt"] }
build = "station"
[[rule]]
when = { building = "train_station" }
build = "station"
[[rule]]
when = { railway = ["rail", "light_rail", "narrow_gauge", "preserved"] }
build = "rail"

# --- Buildings ------------------------------------------------------------
[[rule]]
when = { building = ["commercial", "retail", "office", "supermarket", "kiosk", "hotel", "shop"] }
build = "commercial"
[[rule]]
when = { building = "*", shop = "*" }
build = "commercial"
[[rule]]
when = { building = ["industrial", "warehouse", "factory", "manufacture", "storage_tank", "hangar", "barn"] }
build = "industrial"
[[rule]]
when = { building = "*" }
build = "residential"

# --- Land use ----------------------------------------------------------------
[[rule]]
when = { landuse = "residential" }
build = "residential"
[[rule]]
when = { landuse = ["commercial", "retail"] }
build = "commercial"
[[rule]]
when = { landuse = "industrial" }
build = "industrial"
[[rule]]
when = { leisure = ["park", "garden", "playground"] }
build = "park"
[[rule]]
when = { landuse = ["recreation_ground", "village_green"] }
build = "park"
[[rule]]
when = { natural = ["wood", "tree", "tree_row"] }
build = "trees"
[[rule]]
when = { landuse = ["forest", "orchard"] }
build = "trees"
